{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
	<meta charset="utf-8" />
	<title>Login Page - Bahir Pharma</title>
	<link rel="shortcut icon" href="{% static 'ace/img/favicon.png' %}">
	<meta name="description" content="User login page" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

	<!-- bootstrap & fontawesome -->
	<link rel="stylesheet" href="{% static 'ace/css/bootstrap.min.css' %}" />
	<link rel="stylesheet" href="{% static 'ace/font-awesome/4.5.0/css/font-awesome.min.css' %}" />

	<!-- text fonts -->
	<link rel="stylesheet" href="{% static 'ace/css/fonts.googleapis.com.css' %}" />

	<!-- ace styles -->
	<link rel="stylesheet" href="{% static 'ace/css/ace.min.css' %}" />

	<!--[if lte IE 9]>
			<link rel="stylesheet" href="{% static 'ace/css/ace-part2.min.css' %}" />
		<![endif]-->
	<link rel="stylesheet" href="{% static 'ace/css/ace-rtl.min.css' %}" />

	<!--[if lte IE 9]>
		  <link rel="stylesheet" href="{% static 'ace/css/ace-ie.min.css' %}" />
		<![endif]-->

	<!-- HTML5shiv and Respond.js for IE8 to support HTML5 elements and media queries -->

	<!--[if lte IE 8]>
		<script src="{% static 'ace/js/html5shiv.min.js' %}"></script>
		<script src="{% static 'ace/js/respond.min.js' %}"></script>
		<![endif]-->
</head>

<body class="login-layout">
	<div class="main-container">
		<div class="main-content">
			<div class="row">
				<div class="col-sm-10 col-sm-offset-1">
					<div class="login-container">
						<div class="center">
							<h1>
								<p class="login-box-msg"><img src="{% static 'ace/img/favicon.png' %}"
										class="img-circle" alt="" style="border: 1px #2D508F solid"></p>
								<span class="red">PMS-</span>
								<span class="white" id="id-text2">User</span>
							</h1>
							<h4 class="blue" id="id-company-text">&copy; Bahir</h4>
						</div>



						<div class="position-relative">
							<div id="login-box" class="login-box visible widget-box no-border">
								<div class="widget-body">
									<div class="widget-main">
										<h4 class="header blue lighter bigger">

											User Is In Progress.
										</h4>
										<h4 class="header blue lighter bigger">

											Please Contact to Admin.
										</h4>

										<div class="space-6"></div>





										<div class="space-6"></div>


									</div><!-- /.widget-main -->


								</div><!-- /.widget-body -->
							</div><!-- /.login-box -->


						</div><!-- /.position-relative -->


					</div>
				</div><!-- /.col -->
			</div><!-- /.row -->
		</div><!-- /.main-content -->
	</div><!-- /.main-container -->

	<!-- basic scripts -->




</body>

</html>
