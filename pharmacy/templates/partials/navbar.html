{% load static %} 
<div class="header">
    <div class="header-left">
        <a href="{% url 'admin_dashboard' %}" class="logo">
            <img src="{% static 'img/logo.png' %}" width="35" height="35" alt=""> <span> HMIS</span>
        </a>
        
    </div>

    <a id="toggle_btn" href="javascript:void(0);"><i class="fa fa-bars"></i></a>
    <a id="mobile_btn" class="mobile_btn float-left" href="#sidebar"><i class="fa fa-bars"></i></a>
    
    
    <ul class="nav user-menu float-right">
        <li class="nav-item dropdown d-none d-sm-block">
            <br>
            <form class="form-search" method="get" action="{% url 'search_all' %}">
                <span class="input-icon">
                    <input class="nav-search-input" type="search" placeholder="Search..." name="q" value="{{ request.GET.q }}">
                    <i class="ace-icon fa fa-search nav-search-icon"></i>
                </span>
            </form>
        </li>
        
        <li class="nav-item dropdown has-arrow">
            <a href="#" class="dropdown-toggle nav-link user-link" data-toggle="dropdown">
                <span class="user-img">
                    <img class="rounded-circle" src="{% static 'img/Nasratullah.JPG' %}" width="24" alt="Admin">
                    <span class="status online"></span>
                </span>
                <span>{{ request.user.first_name }}</span>
            </a>
            <div class="dropdown-menu">
                <a class="dropdown-item" href="profile.html">My Profile</a>
                <a class="dropdown-item" href="edit-profile.html">Edit Profile</a>
                <a class="dropdown-item" href="{% url 'register' %}">Create User</a>
                <a class="dropdown-item" href="{% url 'logout' %}">Logout</a>
            </div>
        </li>
    </ul>
    <div class="dropdown mobile-user-menu float-right">
        <a href="#" class="dropdown-toggle" data-toggle="dropdown" aria-expanded="false"><i class="fa fa-ellipsis-v"></i></a>
        <div class="dropdown-menu dropdown-menu-right">
            <a class="dropdown-item" href="profile.html">My Profile</a>
            <a class="dropdown-item" href="edit-profile.html">Edit Profile</a>
            <a class="dropdown-item" href="settings.html">Settings</a>
            <a class="dropdown-item" href="{% url 'logout' %}">Logout</a>
        </div>
    </div>
</div>
