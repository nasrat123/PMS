{% extends 'base.html' %}
{% block content %}
<div class="page-wrapper">
    <div class="container mt-4">
        <div class="page-header">
            <h4 class="page-title">Delete Department</h4>
        </div>

        <div class="card">
            <div class="card-body">
                <p>Are you sure you want to delete <strong>{{ object.name }}</strong>?</p>

                <form method="POST">
                    {% csrf_token %}
                    <button class="btn btn-danger">Yes, Delete</button>
                    <a href="{% url 'department_list' %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
