{% extends 'base.html' %}
{% block content %}
<div class="page-wrapper">
    <div class="container mt-4">

        <div class="page-header">
            <div class="row">
                <div class="col-sm-12">
                    <h3 class="page-title">Departments</h3>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-between mb-3">
          <h4>Total Departments: <span class="text-danger">{{ departments.count }} </span></h4>
          <a href="{% url 'department_add' %}" class="btn btn-success">+ Add Department</a>
        </div>
        

          <div class="col-md-12">
            <div class="table-responsive">
              <table id="dynamic-table" class="table table-striped table-bordered table-hover">
                <thead>
                        <tr>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for d in departments %}
                        <tr>
                            <td><a href="{% url 'department_detail' d.id %}">{{ d.name }}</a></td>
                            <td>{{ d.status }}</td>
                            <td>
                                <a href="{% url 'department_edit' d.id %}" class="btn btn-sm btn-warning">Edit</a>
                                <a href="{% url 'department_delete' d.id %}" class="btn btn-sm btn-danger">Delete</a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="4">No departments found.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
