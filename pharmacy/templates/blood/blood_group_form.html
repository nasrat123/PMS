{% extends "base.html" %}
{% block content %}
<div class="page-wrapper">
  <div class="container mt-4">
    <div class="page-header">
      <h4 class="page-title">{{ view.object|default:"Add / Edit Blood Group" }}</h4>
    </div>

    <div class="card">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="form-group">
            {{ form.name.label_tag }}
            {{ form.name }}
            {% if form.name.errors %}<div class="text-danger small">{{ form.name.errors }}</div>{% endif %}
          </div>

          <div class="mt-3">
            <button class="btn btn-success">Save</button>
            <a href="{% url 'blood_group_list' %}" class="btn btn-secondary ms-2">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
