{% extends "base.html" %}
{% block content %}
<div class="page-wrapper">
  <div class="container mt-4">
  <div class="page-header">
    <div class="row">
      <div class="col-sm-12">
        <h3 class="page-title">Blood Groups</h3>
      </div>
    </div>
  </div>
  <div class="d-flex justify-content-between mb-3">
    <h4>Total Blood Groups: <span class="text-danger">{{ groups.count }} </span></h4>
    <a href="{% url 'blood_group_add' %}" class="btn btn-success">+ Add Blood Group</a>
  </div>


  <div class="col-md-12">
    <div class="table-responsive">
      <table id="dynamic-table" class="table table-striped table-bordered table-hover">
        <thead>


          <tr>
            <th>#</th>
            <th>Blood Group</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for g in groups %}
          <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ g.name }}</td>
            <td>
              <a href="{% url 'blood_group_edit' g.pk %}" class="btn btn-sm btn-outline-warning">Edit</a>
              <a href="{% url 'blood_group_delete' g.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
            </td>
          </tr>
          {% empty %}
          <tr>
            <td colspan="3" class="text-center">No blood groups found.</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
</div>
{% endblock %}
